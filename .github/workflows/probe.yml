name: Secret exposure probe

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hold an env canary, leave a sibling process holding it, then exit
        env:
          ENV_CANARY: ${{ secrets.PROBE_ENV_CANARY }}
        run: |
          set -euo pipefail
          setsid env SIBLING_CANARY="$ENV_CANARY" sleep 900 </dev/null >/dev/null 2>&1 &
          sleep 1
          echo "sibling started"

      - name: Reference the memory canary without putting it in any environment
        env:
          MEM_CANARY_IS_SET: ${{ secrets.PROBE_MEM_CANARY != '' }}
        run: echo "the memory canary is referenced by this workflow: $MEM_CANARY_IS_SET"

      - name: Probe
        run: |
          set -uo pipefail
          echo "=== identity ==="
          id
          echo "=== ptrace_scope ==="
          cat /proc/sys/kernel/yama/ptrace_scope 2>&1 || echo "absent"
          echo "=== passwordless sudo for runner ==="
          sudo -n true && echo "yes" || echo "no"
          echo "=== RUNNER_TEMP path permissions ==="
          namei -l "$RUNNER_TEMP" 2>&1 | head -20
          echo "=== step scripts under RUNNER_TEMP ==="
          ls -la "$RUNNER_TEMP"/*.sh 2>&1 | head -20
          if grep -q 'coralprobe-env-' "$RUNNER_TEMP"/*.sh 2>/dev/null; then
            echo "env canary IS present in a step script on disk"
          else
            echo "env canary is NOT present in any step script on disk"
          fi
          echo "=== workspace permissions ==="
          namei -l "$GITHUB_WORKSPACE" 2>&1 | head -20
          echo "=== sibling process ==="
          SIB=$(pgrep -f 'sleep 900' | head -1)
          echo "sibling pid: ${SIB:-none}"
          echo "=== same-uid, non-ancestor /proc/*/environ scan ==="
          python3 - <<'PY'
          import glob

          hits, denied = [], 0
          for path in glob.glob("/proc/[0-9]*/environ"):
              try:
                  data = open(path, "rb").read()
              except OSError:
                  denied += 1
                  continue
              if b"coralprobe-env-" in data:
                  hits.append(path)
          print("environ files that hold the env canary:", hits)
          print("environ files we could not open:", denied)
          PY
          echo "=== a second uid with no sudo ==="
          sudo useradd -m -s /bin/bash probeuser
          sudo -u probeuser -H bash -c 'id'
          sudo -u probeuser -H bash -c 'sudo -n true 2>/dev/null && echo "probeuser HAS passwordless sudo" || echo "probeuser has NO passwordless sudo"'
          sudo -u probeuser -H bash -c "cat /proc/${SIB:-1}/environ >/dev/null 2>&1 && echo 'probeuser CAN read a runner process environ' || echo 'probeuser CANNOT read a runner process environ'"
          sudo -u probeuser -H bash -c "ls '$RUNNER_TEMP' >/dev/null 2>&1 && echo 'probeuser CAN list RUNNER_TEMP' || echo 'probeuser CANNOT list RUNNER_TEMP'"
          sudo -u probeuser -H bash -c "cat '$RUNNER_TEMP'/*.sh >/dev/null 2>&1 && echo 'probeuser CAN read step scripts' || echo 'probeuser CANNOT read step scripts'"
          sudo -u probeuser -H bash -c "ls '$GITHUB_WORKSPACE' >/dev/null 2>&1 && echo 'probeuser CAN read the workspace' || echo 'probeuser CANNOT read the workspace'"
          sudo -u probeuser -H bash -c "touch '$GITHUB_WORKSPACE/probe-write' 2>/dev/null && echo 'probeuser CAN write the workspace' || echo 'probeuser CANNOT write the workspace'"
          sudo -u probeuser -H bash -c 'python3 -V; node -v; go version' 2>&1 | head -5
          sudo -u probeuser -H bash -c 'ls /home/runner/.cache >/dev/null 2>&1 && echo "probeuser CAN read /home/runner/.cache" || echo "probeuser CANNOT read /home/runner/.cache"'
          echo "=== Runner.Worker memory ==="
          WORKER=$(pgrep -f 'Runner.Worker' | head -1)
          echo "worker pid: ${WORKER:-none}"
          sudo WORKER="${WORKER:-0}" python3 - <<'PY'
          import os
          import re

          pid = os.environ["WORKER"]
          needles = {
              b"coralprobe-env-": 0,
              b"coralprobe-mem-": 0,
              b"coralprobe-unref-": 0,
              b'"isSecret":true': 0,
          }
          regions = []
          with open(f"/proc/{pid}/maps") as handle:
              for line in handle:
                  fields = line.split()
                  bounds, perms = fields[0], fields[1]
                  if not perms.startswith("r"):
                      continue
                  low, high = (int(part, 16) for part in bounds.split("-"))
                  if high - low > 512 * 1024 * 1024:
                      continue
                  regions.append((low, high))
          scanned = 0
          with open(f"/proc/{pid}/mem", "rb", 0) as mem:
              for low, high in regions:
                  try:
                      mem.seek(low)
                      chunk = mem.read(high - low)
                  except (OSError, ValueError, OverflowError):
                      continue
                  scanned += len(chunk)
                  for needle in needles:
                      needles[needle] += chunk.count(needle)
          print("bytes scanned:", scanned)
          for needle, count in needles.items():
              print(f"{needle.decode()}: {count} occurrence(s)")
          PY
          echo "=== can probeuser read Runner.Worker memory ==="
          sudo -u probeuser -H bash -c "head -c 1 /proc/${WORKER:-1}/mem >/dev/null 2>&1 && echo 'probeuser CAN open worker mem' || echo 'probeuser CANNOT open worker mem'"
          sudo -u probeuser -H bash -c "cat /proc/${WORKER:-1}/environ >/dev/null 2>&1 && echo 'probeuser CAN read worker environ' || echo 'probeuser CANNOT read worker environ'"
          echo "=== runner-uid attach to an ancestor ==="
          python3 - <<'PY'
          import ctypes
          import os

          libc = ctypes.CDLL("libc.so.6", use_errno=True)
          parent = os.getppid()
          rc = libc.ptrace(16, parent, 0, 0)  # PTRACE_ATTACH
          print("PTRACE_ATTACH to our own parent:", "allowed" if rc == 0 else f"denied errno {ctypes.get_errno()}")
          PY
