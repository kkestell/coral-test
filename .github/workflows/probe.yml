name: Probe
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    outputs:
      secretish: ${{ steps.make.outputs.secretish }}
    steps:
      - id: make
        run: echo "secretish=PROBE-VALUE-9f3a1c2b" >>"$GITHUB_OUTPUT"

  consume:
    needs: produce
    runs-on: ubuntu-latest
    env:
      JOB_LEVEL: ${{ needs.produce.outputs.secretish }}
    steps:
      - name: mask only
        run: echo "::add-mask::$JOB_LEVEL"

      - name: step env after mask
        env:
          STEP_LEVEL: ${{ needs.produce.outputs.secretish }}
        run: echo "done"

      - name: exported var
        run: echo "EXPORTED=$JOB_LEVEL" >>"$GITHUB_ENV"

      - name: sees exported
        run: echo "done"
