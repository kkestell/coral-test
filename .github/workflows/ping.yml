name: Ping
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: kkestell/coral/actions/setup@main
      - run: |
          set -euo pipefail
          "$CORAL_BIN/coral" --help
          "$CORAL_BIN/coral" resolve || echo "resolve exited $?"
        env:
          CORAL_BIN: ${{ steps.setup.outputs.bin }}
          GITHUB_TOKEN: ${{ github.token }}
